<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birkenstock × Brand Builders — Thank You Video</title>
  <style>
    :root { color-scheme: light; --ink:#241a13; --cork:#8f5a32; --sand:#f4ede3; --line:#d6c4ae; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#dfd1c1; color:var(--ink); font-family:"Avenir Next", Arial, sans-serif; }
    main { width:min(1100px, 94vw); padding:24px; }
    .shell { background:#fbf9f6; border:1px solid rgba(90,55,29,.2); border-radius:22px; box-shadow:0 18px 54px rgba(45,28,16,.18); padding:20px; }
    .head { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:14px; }
    .eyebrow { margin:0 0 5px; letter-spacing:.18em; font-size:11px; font-weight:700; color:var(--cork); text-transform:uppercase; }
    h1 { margin:0; font-family:Baskerville, Georgia, serif; font-size:30px; line-height:1; font-weight:600; }
    .note { max-width:410px; margin:0; font-size:13px; line-height:1.45; color:#5d5046; text-align:right; }
    canvas { display:block; width:100%; height:auto; border-radius:14px; background:#f4ede3; border:1px solid #ddcdbb; }
    .controls { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px; }
    button { border:0; border-radius:999px; padding:12px 20px; background:#241a13; color:#fffaf3; font:700 12px/1 "Avenir Next", Arial, sans-serif; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; }
    #status { font-size:13px; color:#66574b; }
    a { color:var(--cork); font-size:13px; font-weight:700; }
    .small { margin:12px 0 0; color:#806f61; font-size:11px; letter-spacing:.04em; }
  </style>
</head>
<body>
  <main>
    <section class="shell">
      <div class="head">
        <div>
          <p class="eyebrow">Birkenstock / Brand Builders</p>
          <h1>Thank-you video export</h1>
        </div>
      <p class="note">Face-forward portraits change one by one. The Arizona sandal remains the constant product cue in every frame.</p>
      </div>
      <canvas id="canvas" width="1920" height="1080" aria-label="Video preview"></canvas>
      <div class="controls">
        <button id="render">Render &amp; download video</button>
        <span id="status">Loading source photos…</span>
        <a id="download" hidden>Download again</a>
      </div>
      <p class="small">Silent 16:9 export • approximately 21 seconds • uses the photos supplied for this presentation</p>
    </section>
  </main>
<script>
const W = 1920, H = 1080, FPS = 30;
const introDuration = 2.2, outroDuration = 2.6, sceneHold = 1.4, transition = 0.35;
const labels = [
  'Everyday ease',
  'Street style',
  'Show up',
  'Confidence',
  'Quietly iconic',
  'The classic',
  'Spotlight',
  'Go everywhere',
  'Make it yours'
];
const imagePaths = [
  'assets/thank-you/person-01.jpg',
  'assets/thank-you/person-02.jpeg',
  'assets/thank-you/person-03.jpeg',
  'assets/thank-you/person-04.jpeg',
  'assets/thank-you/person-05.jpeg',
  'assets/thank-you/person-06.jpeg',
  'assets/thank-you/person-07.jpeg',
  'assets/thank-you/person-08.jpeg',
  'assets/thank-you/person-09.jpeg'
];
// Normalized source crops keep every face visible while excluding the arrows,
// stickers, product collages, captions, and lower watermarks in the supplied
// reference images. These are presentation crops; the originals remain intact.
const cropSpecs = [
  {x:.02,y:0,w:.95,h:.99},
  {x:.34,y:0,w:.20,h:.99},
  {x:.10,y:.04,w:.55,h:.89},
  {x:.02,y:.08,w:.96,h:.90},
  {x:.02,y:.02,w:.94,h:.96},
  {x:0,y:.02,w:.50,h:.76},
  {x:.03,y:.08,w:.60,h:.84},
  {x:.02,y:.02,w:.94,h:.90},
  {x:.06,y:.04,w:.42,h:.70}
];
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';
const statusEl = document.getElementById('status');
const renderBtn = document.getElementById('render');
const downloadLink = document.getElementById('download');
const personImages = [];
let productImage;
let currentBlobUrl = null;

function rgba(hex, alpha=1) {
  const value = hex.replace('#','');
  const n = parseInt(value.length === 3 ? value.split('').map(x=>x+x).join('') : value, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`;
}
function roundRectPath(x,y,w,h,r) {
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath();
}
function fillRound(x,y,w,h,r,fill) { roundRectPath(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); }
function strokeRound(x,y,w,h,r,stroke,line=1) { roundRectPath(x,y,w,h,r); ctx.strokeStyle=stroke; ctx.lineWidth=line; ctx.stroke(); }
function text(str,x,y,size,color,opts={}) {
  const family = opts.family || '"Avenir Next", Arial, sans-serif';
  const weight = opts.weight || 400;
  ctx.font = `${weight} ${size}px ${family}`;
  ctx.fillStyle = color;
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = 'top';
  const lines = String(str).split('\n');
  const lineHeight = opts.lineHeight || size*1.18;
  lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));
}
function imageCover(image,x,y,w,h) {
  const scale = Math.max(w/image.naturalWidth, h/image.naturalHeight);
  const dw=image.naturalWidth*scale, dh=image.naturalHeight*scale;
  ctx.drawImage(image,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function imageFit(image,x,y,w,h) {
  const scale = Math.min(w/image.naturalWidth, h/image.naturalHeight);
  const dw=image.naturalWidth*scale, dh=image.naturalHeight*scale;
  ctx.drawImage(image,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function drawSourceCrop(image,spec,x,y,w,h) {
  const sx=spec.x*image.naturalWidth, sy=spec.y*image.naturalHeight;
  const sw=spec.w*image.naturalWidth, sh=spec.h*image.naturalHeight;
  const scale=Math.min(w/sw,h/sh);
  const dw=sw*scale, dh=sh*scale;
  const dx=x+(w-dw)/2, dy=y+(h-dh)/2;
  ctx.drawImage(image,sx,sy,sw,sh,dx,dy,dw,dh);
  return {x:dx,y:dy,w:dw,h:dh};
}
function backdrop() {
  ctx.fillStyle='#f5efe6'; ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'rgba(255,252,247,.98)'); g.addColorStop(1,'rgba(203,170,134,.27)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(125,88,54,.14)'; ctx.lineWidth=1;
  for(let i=0;i<10;i++){ const x=i*240-150; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+420,H); ctx.stroke(); }
}
function header() {
  text('BIRKENSTOCK',140,54,24,'#241a13',{weight:700});
  text('BRAND BUILDERS / THANK YOU',1780,62,14,'#694628',{weight:700,align:'right'});
}
function productPanel(alpha=1) {
  ctx.save();
  ctx.shadowColor=`rgba(45,28,16,${.17*alpha})`; ctx.shadowBlur=28; ctx.shadowOffsetY=18;
  fillRound(1260,150,520,780,28,`rgba(38,25,17,${alpha})`); ctx.restore();
  ctx.save(); roundRectPath(1292,200,456,348,18); ctx.clip(); imageCover(productImage,1292,200,456,348); ctx.fillStyle=`rgba(20,12,7,${.12*alpha})`; ctx.fillRect(1292,200,456,348); ctx.restore();
  text('THE CONSTANT',1295,590,14,`rgba(212,174,128,${alpha})`,{weight:700});
  text('ARIZONA',1295,624,47,`rgba(250,243,231,${alpha})`,{family:'Baskerville, Georgia, serif',weight:600});
  text('The signature footbed,\nkept in every frame.',1295,704,20,`rgba(220,207,190,${alpha})`,{lineHeight:29});
  ctx.strokeStyle=`rgba(171,130,89,${.8*alpha})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(1295,816); ctx.lineTo(1718,816); ctx.stroke();
  text('NATURAL COMFORT / TIMELESS FORM',1295,844,12,`rgba(194,164,129,${alpha})`,{weight:600});
}
function personCard(image,label,index,alpha=1) {
  ctx.save(); ctx.shadowColor=`rgba(45,28,16,${.17*alpha})`; ctx.shadowBlur=28; ctx.shadowOffsetY=18; fillRound(140,150,1040,780,28,`rgba(41,28,19,${alpha})`); ctx.restore();
  const portrait={x:180,y:178,w:540,h:724};
  ctx.save();
  ctx.shadowColor=`rgba(12,8,5,${.18*alpha})`; ctx.shadowBlur=18; ctx.shadowOffsetY=10;
  fillRound(portrait.x,portrait.y,portrait.w,portrait.h,18,`rgba(220,202,181,${alpha})`);
  ctx.restore();
  ctx.save(); roundRectPath(portrait.x,portrait.y,portrait.w,portrait.h,18); ctx.clip();
  ctx.fillStyle=`rgba(224,207,188,${alpha})`; ctx.fillRect(portrait.x,portrait.y,portrait.w,portrait.h);
  const sourceRect=drawSourceCrop(image,cropSpecs[index],portrait.x,portrait.y,portrait.w,portrait.h);
  // The street-style source contains a white callout ring around the feet.
  // Paint only that annotation area with the surrounding pavement tone so the
  // full person and footwear remain visible without the graphic overlay.
  if(index===1){
    ctx.fillStyle=`rgba(118,117,111,${alpha})`;
    ctx.fillRect(sourceRect.x+sourceRect.w*.58,sourceRect.y+sourceRect.h*.76,sourceRect.w*.42,sourceRect.h*.24);
  }
  // Replace the supplied collage watermark line with a clean editorial strap;
  // the subject and both feet remain visible below it.
  if(index===5){
    ctx.fillStyle=`rgba(41,28,19,${.86*alpha})`;
    ctx.fillRect(sourceRect.x,sourceRect.y+sourceRect.h*.75,sourceRect.w,sourceRect.h*.08);
    text('BIRKENSTOCK / BRAND BUILDERS',sourceRect.x+14,sourceRect.y+sourceRect.h*.765,10,`rgba(239,226,209,${alpha})`,{weight:700});
  }
  const g=ctx.createLinearGradient(0,520,0,902); g.addColorStop(0,`rgba(20,12,7,${.02*alpha})`); g.addColorStop(1,`rgba(20,12,7,${.22*alpha})`); ctx.fillStyle=g; ctx.fillRect(portrait.x,portrait.y,portrait.w,portrait.h);
  ctx.restore();
  strokeRound(portrait.x,portrait.y,portrait.w,portrait.h,18,`rgba(239,226,209,${.60*alpha})`,2);
  const copyX=780;
  text('FULL-BODY / '+String(index+1).padStart(2,'0')+' OF 09',copyX,266,14,`rgba(212,174,128,${alpha})`,{weight:700});
  text(label.toUpperCase(),copyX,332,42,`rgba(250,243,231,${alpha})`,{family:'Baskerville, Georgia, serif',weight:600});
  ctx.strokeStyle=`rgba(171,130,89,${.8*alpha})`; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(copyX,470); ctx.lineTo(1095,470); ctx.stroke();
  text('FACE TO FOOT.\nCLEANER STORY.',copyX,520,28,`rgba(234,218,196,${alpha})`,{weight:700,lineHeight:35});
  text('Different people.\nOne constant choice.',copyX,660,20,`rgba(205,180,153,${alpha})`,{lineHeight:29});
}
function dots(current) {
  for(let i=0;i<labels.length;i++){ ctx.fillStyle=i===current?'#a86f3e':'rgba(200,177,151,.55)'; ctx.beginPath(); ctx.arc(147+i*23,975,i===current?5:3,0,Math.PI*2); ctx.fill(); }
  text('BIRKENSTOCK / BRAND BUILDERS',1780,958,12,'#694628',{weight:700,align:'right'});
}
function drawIntro(progress) {
  backdrop(); header(); const f=Math.min(1,Math.max(0,progress*1.8));
  text('A THANK YOU',144,260-(1-f)*20,96,`rgba(36,26,19,${f})`,{family:'Baskerville, Georgia, serif',weight:600});
  text('FOR WALKING WITH US.',148,372-(1-f)*20,28,`rgba(122,78,46,${f})`,{weight:700});
  text('Every style has a story.\nThe comfort stays unmistakable.',150,530,26,`rgba(79,61,47,${f})`,{lineHeight:36});
  ctx.strokeStyle=`rgba(154,113,75,${f})`; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(150,682); ctx.lineTo(150,772); ctx.stroke();
  text('BIRKENSTOCK × BRAND BUILDERS',180,704,16,`rgba(140,93,55,${f})`,{weight:700}); productPanel(f);
}
function drawOutro(progress) {
  backdrop(); header(); const f=Math.min(1,Math.max(0,progress*2));
  ctx.save(); ctx.shadowColor=`rgba(45,28,16,${.18*f})`; ctx.shadowBlur=30; ctx.shadowOffsetY=18; fillRound(124,188,780,600,30,`rgba(41,26,17,${f})`); ctx.restore();
  ctx.save(); roundRectPath(152,216,724,544,22); ctx.clip(); imageCover(productImage,152,216,724,544); ctx.restore();
  text('THANK YOU',1030,300,92,`rgba(36,26,19,${f})`,{family:'Baskerville, Georgia, serif',weight:600});
  text('FOR WALKING\nWITH US.',1034,430,36,`rgba(122,78,46,${f})`,{weight:700,lineHeight:40});
  text('BIRKENSTOCK',1035,638,26,`rgba(49,33,23,${f})`,{weight:700});
  text('PRESENTED BY BRAND BUILDERS',1038,708,16,`rgba(140,93,55,${f})`,{weight:700});
  text('THE ART OF WALKING DIFFERENT.',1038,774,13,`rgba(107,84,66,${f})`,{weight:600});
}
function drawScene(index,alpha=1) {
  backdrop(); header(); personCard(personImages[index],labels[index],index,alpha); productPanel(alpha); dots(index);
}
function totalDuration(){ return introDuration + sceneHold + (labels.length-1)*(sceneHold+transition) + outroDuration; }
function drawAt(time) {
  const sceneTime=sceneHold+transition;
  const sceneDuration=sceneHold+(labels.length-1)*sceneTime;
  if(time<introDuration){ drawIntro(time/introDuration); return; }
  if(time<introDuration+sceneDuration){
    const local=time-introDuration;
    if(local<sceneHold){ drawScene(0); return; }
    const offset=local-sceneHold;
    const block=Math.floor(offset/sceneTime);
    const within=offset-block*sceneTime;
    const current=Math.min(block,labels.length-1);
    if(current>=labels.length-1){ drawScene(labels.length-1); return; }
    if(within<transition){ const blend=within/transition; drawScene(current,1-blend); drawScene(current+1,blend); }
    else drawScene(current+1);
    return;
  }
  drawOutro((time-introDuration-sceneDuration)/outroDuration);
}
function load(path){ return new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=path; }); }
async function prepare(){
  try{
    personImages.push(...await Promise.all(imagePaths.map(load)));
    productImage=await load('assets/thank-you/arizona.jpg');
    // Show a useful editorial preview while keeping the recorded video’s first
    // frame as the intentional fade-in from the opening card.
    drawAt(0.8); statusEl.textContent='Ready — click Render & download video.'; renderBtn.disabled=false;
  }catch(e){ statusEl.textContent='Could not load a source image.'; console.error(e); }
}
async function renderVideo(){
  if(!window.MediaRecorder || !canvas.captureStream){ statusEl.textContent='This browser cannot encode the video. Open this page in Safari or Chrome.'; return; }
  const candidates=['video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm;codecs=vp8'];
  const mime=candidates.find(x=>MediaRecorder.isTypeSupported(x));
  if(!mime){ statusEl.textContent='No supported video codec was found in this browser.'; return; }
  renderBtn.disabled=true; downloadLink.hidden=true;
  const chunks=[]; const stream=canvas.captureStream(FPS);
  const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
  recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(resolve=>recorder.onstop=resolve);
  recorder.start(1000);
  const total=totalDuration(); const start=performance.now();
  statusEl.textContent='Rendering 0%…';
  await new Promise(resolve=>{
    function tick(now){
      const t=Math.min(total,(now-start)/1000); drawAt(t); statusEl.textContent=`Rendering ${Math.round((t/total)*100)}%…`;
      if(t<total) requestAnimationFrame(tick); else { drawAt(total); recorder.stop(); resolve(); }
    }
    requestAnimationFrame(tick);
  });
  await done;
  const blob=new Blob(chunks,{type:mime});
  if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  currentBlobUrl=URL.createObjectURL(blob);
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const filename=`Birkenstock_Brand_Builders_Thank_You_Full_Body.${ext}`;
  downloadLink.href=currentBlobUrl; downloadLink.download=filename; downloadLink.textContent=`Download again (${ext.toUpperCase()})`; downloadLink.hidden=false;
  const a=document.createElement('a'); a.href=currentBlobUrl; a.download=filename; a.click();
  statusEl.textContent=`Done — ${ext.toUpperCase()} video downloaded.`; renderBtn.disabled=false;
}
renderBtn.disabled=true; renderBtn.addEventListener('click',renderVideo); prepare();
</script>
</body>
</html>
